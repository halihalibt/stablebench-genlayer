name: Local contract tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: node scripts/check-journal.mjs
      - name: Recompute finalized proof when supplied
        if: ${{ hashFiles('evidence/verification.json') != '' }}
        run: python3 scripts/verify-proof.py
